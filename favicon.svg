  <line x1="16" y1="30" x2="16" y2="24" stroke="#c9a84c" stroke-width="0.5" opacity="0.35"/>
  <line x1="4.5" y1="23.5" x2="9" y2="20.5" stroke="#c9a84c" stroke-width="0.5" opacity="0.35"/>
  <line x1="4.5" y1="8.5"  x2="9" y2="11.5" stroke="#c9a84c" stroke-width="0.5" opacity="0.35"/>
